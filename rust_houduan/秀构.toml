["项目"]
"名称" = "renwu-houduan"
"版本" = "0.1.0"
"语言版本" = "2024"

[["可执行文件"]]
"名称" = "renwu-houduan"
"路径" = "src/启动.rs"

["依赖"]
anyhow = "1"
apalis = "1"
apalis-postgres = "1"
argon2 = "0.5"
axum = { "版本" = "0.8", "特性" = ["macros"] }
chrono = { "版本" = "0.4", "特性" = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { "版本" = "0.12", "默认特性" = false, "特性" = ["rustls-tls"] }
pinyin = "0.10"
rumqttc = "0.25"
serde = { "版本" = "1", "特性" = ["derive"] }
serde_json = "1"
sqlx = { "版本" = "0.9", "特性" = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2"
tokio = { "版本" = "1", "特性" = ["full"] }
tower-http = { "版本" = "0.6", "特性" = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { "版本" = "0.3", "特性" = ["env-filter", "fmt"] }
uuid = { "版本" = "1", "特性" = ["serde", "v4"] }
